<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orçamento de prestação de serviços | Bruno Silva</title>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080a10;--pn:#12141b;--ln:#262933;--rd:#ff1a0a;--mu:#9ea1ab;--tx:#fff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:radial-gradient(ellipse at 95% 0,#ff1a0a22,transparent 45%),var(--bg);color:var(--tx);font-family:'Saira',Arial,sans-serif;font-size:16px;line-height:1.45}
.wrap{max-width:960px;margin:0 auto;padding:32px 20px 64px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding-bottom:24px;border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:16px}.brand img{width:86px;height:50px;object-fit:cover}
.brand b{display:block;font-weight:800;letter-spacing:2px;font-size:20px}.brand small{color:var(--mu);letter-spacing:4px;font-size:12px}
.eyebrow{color:var(--rd);font-weight:600;letter-spacing:6px;font-size:13px;text-transform:uppercase}
h1{margin:6px 0 0;font-weight:800;font-size:clamp(30px,6vw,52px);line-height:1.08}h1 em{font-style:normal;color:var(--rd)}
h2{margin:0 0 16px;font-size:14px;letter-spacing:4px;text-transform:uppercase;color:var(--rd);font-weight:600}
section{background:var(--pn);border:1px solid var(--ln);padding:24px;margin-top:20px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
label{display:block;font-size:13px;color:var(--mu);letter-spacing:1px;text-transform:uppercase}
input,textarea,select{display:block;width:100%;margin-top:6px;padding:12px 14px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);font:inherit;border-radius:0}
input:focus,textarea:focus,select:focus{outline:2px solid var(--rd);outline-offset:0;border-color:var(--rd)}
textarea{resize:vertical;min-height:70px}
.item{border:1px solid var(--ln);border-left:6px solid var(--rd);background:#0d0f16;padding:16px;margin-bottom:14px;display:grid;gap:12px;grid-template-columns:2fr 90px 150px 150px 44px;align-items:end}
.item .desc{grid-column:1/-1}
.tot{font-weight:800;font-size:20px;padding:12px 0}
.btn{background:var(--rd);color:#fff;border:1px solid var(--rd);font:inherit;font-weight:800;padding:14px 22px;cursor:pointer;letter-spacing:1px;min-height:44px}
.btn:hover{background:#d90f00}.btn.ghost{background:transparent;border-color:var(--ln)}.btn.ghost:hover{border-color:var(--rd);background:transparent}
.x{min-height:44px;width:44px;background:transparent;border:1px solid var(--ln);color:var(--mu);font-size:22px;cursor:pointer}.x:hover{border-color:var(--rd);color:#fff}
.sum{margin-left:auto;max-width:380px;margin-top:20px}
.sum div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln);color:var(--mu)}
.sum .big{color:#fff;font-weight:800;font-size:28px;border:0;padding-top:14px}.sum .big span:last-child{color:var(--rd)}
.disc{display:grid;grid-template-columns:110px 1fr;gap:10px;margin-top:14px}
.pay{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.opt{border:1px solid var(--ln);background:#0d0f16;padding:18px}
.opt .h{display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:800;font-size:20px;letter-spacing:1px;text-transform:none;color:#fff}
.opt .h input{width:22px;height:22px;margin:0;accent-color:var(--rd)}
.opt.on{border-color:var(--rd)}.opt .body{display:none;margin-top:14px;gap:12px}.opt.on .body{display:grid}
.acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.pv{display:none}
@media(max-width:720px){.item{grid-template-columns:1fr 1fr}.item>:first-child{grid-column:1/-1}.item .x{grid-column:1/-1;width:100%}.sum{max-width:none}}
@media print{
:root{--bg:#fff;--pn:#fff;--ln:#cfd2d8;--mu:#555;--tx:#111;padding:0}
body{background:#fff;color:#111;font-size:12px}.wrap{padding:0}
.noprint,.x,.acts{display:none!important}
header.top{background:#080a10;color:#fff;padding:14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}.brand small{color:#9ea1ab}
section,.item,.opt{background:#fff!important;break-inside:avoid}
input,textarea,select{background:#fff;color:#111;border:0;border-bottom:1px solid #cfd2d8;padding:4px 0}
.opt:not(.on){display:none}.opt .h input{display:none}.opt .body{display:grid}
.sum .big span:last-child,h2,.eyebrow{color:#d90f00}
.item{grid-template-columns:2fr 60px 110px 110px}
}
</style></head>

<div class="grid" style="min-width:min(100%,360px);flex:1;max-width:420px"><label>Orçamento nº<input id="num" placeholder="ORC-0001"></label><label>Data<input id="date" type="date"></label></div></header>
<div style="padding:32px 0 4px"><div class="eyebrow">Proposta comercial</div><h1>Orçamento de <em>prestação de serviços</em></h1></div>

<section><h2>Prestador e cliente</h2><div class="grid">
<label>Prestador<input id="pn" value="Bruno Silva"></label>
<label>Contato do prestador<input id="pc" value="(34) 99109-9276"></label>
<label>Cliente<input id="cn" placeholder="Nome do cliente"></label>
<label>Empresa<input id="ce" placeholder="Razão social ou nome fantasia"></label>
<label>E-mail ou telefone do cliente<input id="cc" placeholder="contato@empresa.com"></label>
<label>Validade da proposta (dias)<input id="val" type="number" min="1" value="7"></label></div></section>

<section><h2>Serviços</h2><div id="list"></div>
<button class="btn noprint" id="add" type="button">+ Adicionar serviço</button>
<div class="sum"><div><span>Subtotal</span><span id="sub">R$ 0,00</span></div>
<div class="disc noprint"><select id="dt" aria-label="Tipo de desconto"><option value="v">R$</option><option value="p">%</option></select><input id="dv" type="number" min="0" step="0.01" placeholder="Desconto" aria-label="Desconto"></div>
<div><span>Desconto</span><span id="dsc">R$ 0,00</span></div>
<div class="big"><span>Total</span><span id="tot">R$ 0,00</span></div></div></section>

<section><h2>Forma de pagamento</h2><div class="pay">
<div class="opt on" id="o-pix"><label class="h"><input type="checkbox" id="u-pix" checked> PIX</label><div class="body">
<label>Tipo de chave<select id="pk"><option>CPF/CNPJ</option><option>E-mail</option><option>Telefone</option><option>Chave aleatória</option></select></label>
<label>Chave PIX<input id="pv" placeholder="Informe a chave PIX"></label>
<label>Favorecido<input id="pf" placeholder="Nome do titular"></label></div></div>
<div class="opt" id="o-bol"><label class="h"><input type="checkbox" id="u-bol"> Boleto</label><div class="body">
<label>Vencimento<input id="bv" type="date"></label>
<label>Emissão do boleto<select id="be"><option>Enviado por e-mail</option><option>Enviado por WhatsApp</option><option>Emitido após aprovação</option></select></label></div></div></div>
<div class="grid" style="margin-top:14px"><label style="grid-column:1/-1">Condições de pagamento<input id="cp" placeholder="Ex.: 50% na aprovação e 50% na entrega"></label></div></section>

<section><h2>Observações e escopo</h2><label>Prazos, entregas e informações adicionais<textarea id="obs" placeholder="Descreva prazos, o que está incluso e o que não está."></textarea></label></section>

<div class="acts noprint"><button class="btn" id="pr" type="button">Imprimir / salvar em PDF</button><button class="btn ghost" id="clr" type="button">Limpar orçamento</button></div>
<p class="noprint" style="color:var(--mu);font-size:13px">Os dados ficam salvos apenas neste navegador.</p>
</div>
<script>
(function(){
var K='orc-bs-v1',$=function(s){return document.querySelector(s)},items=[{n:'',d:'',q:1,v:''}];
var F=['num','date','pn','pc','cn','ce','cc','val','dt','dv','pk','pv','pf','bv','be','cp','obs'];
function fmt(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function save(){try{var o={items:items,u:[$('#u-pix').checked,$('#u-bol').checked]};F.forEach(function(i){o[i]=$('#'+i).value});localStorage.setItem(K,JSON.stringify(o))}catch(e){}}
function calc(){var s=0;items.forEach(function(it,i){var t=(+it.q||0)*(+it.v||0);s+=t;var e=document.getElementById('t'+i);if(e)e.textContent=fmt(t)});
var d=+$('#dv').value||0,dd=$('#dt').value==='p'?s*d/100:d;dd=Math.min(Math.max(dd,0),s);
$('#sub').textContent=fmt(s);$('#dsc').textContent='− '+fmt(dd);$('#tot').textContent=fmt(s-dd)}
function render(){var L=$('#list');L.innerHTML='';items.forEach(function(it,i){var r=document.createElement('div');r.className='item';
r.innerHTML='<label>Serviço<input data-k="n" placeholder="Ex.: Gestão de tráfego pago"></label><label>Qtd.<input data-k="q" type="number" min="0" step="1"></label><label>Valor unitário (R$)<input data-k="v" type="number" min="0" step="0.01" placeholder="0,00"></label><div><label>Total</label><div class="tot" id="t'+i+'">R$ 0,00</div></div><button class="x" type="button" aria-label="Remover serviço">×</button><label class="desc">Descrição<textarea data-k="d" placeholder="O que está incluso neste serviço"></textarea></label>';
r.querySelectorAll('[data-k]').forEach(function(f){f.value=it[f.dataset.k];f.addEventListener('input',function(){it[f.dataset.k]=f.value;calc();save()})});
r.querySelector('.x').addEventListener('click',function(){if(items.length>1){items.splice(i,1)}else{items=[{n:'',d:'',q:1,v:''}]}render();save()});L.appendChild(r)});calc()}
function pay(){$('#o-pix').classList.toggle('on',$('#u-pix').checked);$('#o-bol').classList.toggle('on',$('#u-bol').checked)}
function load(){try{var o=JSON.parse(localStorage.getItem(K)||'null');if(o){if(o.items&&o.items.length)items=o.items;F.forEach(function(i){if(o[i]!=null)$('#'+i).value=o[i]});if(o.u){$('#u-pix').checked=o.u[0];$('#u-bol').checked=o.u[1]}}}catch(e){}
if(!$('#date').value)$('#date').value=new Date().toISOString().slice(0,10);if(!$('#num').value)$('#num').value='ORC-'+new Date().toISOString().slice(2,10).replace(/-/g,'')}
load();render();pay();
$('#add').addEventListener('click',function(){items.push({n:'',d:'',q:1,v:''});render();save()});
['u-pix','u-bol'].forEach(function(i){$('#'+i).addEventListener('change',function(){pay();save()})});
F.forEach(function(i){$('#'+i).addEventListener('input',function(){calc();save()})});
$('#pr').addEventListener('click',function(){try{window.print()}catch(e){}});
$('#clr').addEventListener('click',function(){try{localStorage.removeItem(K)}catch(e){}items=[{n:'',d:'',q:1,v:''}];F.forEach(function(i){var e=$('#'+i);e.value=(i==='pn')?'Bruno Silva':(i==='pc')?'(34) 99109-9276':(i==='val')?'7':(i==='dt')?'v':(i==='pk')?'CPF/CNPJ':(i==='be')?'Enviado por e-mail':''});$('#u-pix').checked=true;$('#u-bol').checked=false;$('#date').value=new Date().toISOString().slice(0,10);$('#num').value='ORC-'+new Date().toISOString().slice(2,10).replace(/-/g,'');pay();render()});
})();
</script></body></html>
